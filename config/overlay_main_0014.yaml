# MAIN.CD member 0014 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_014 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2800 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8608 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CB5BC) (0x7B0 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0014
sha1: ca66b7d2c8dcb6ef7f8d7c2891d84c6446c59a4b

options:
  platform: psx
  basename: main_0014
  base_path: ../
  target_path: extracted/overlays/main/0014.bin
  asm_path: asm/overlays/main_0014
  src_path: src/overlays/main_0014
  build_path: build
  ld_script_path: config/main_0014.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0014.auto.txt
    - config/symbol_addrs.main_0014.txt
  undefined_syms_auto_path: config/undefined_syms.main_0014.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0014.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0014
    type: code
    start: 0x0
    vram: 0x800C8608
    subsegments:
      - [0x0, data, main_0014_container]
      - [0x2800, data, main_0014_hdr]
      - [0x2804, asm, main_0014]
      - [0x2FB4, data, main_0014_tail]

  - [0x9800]
