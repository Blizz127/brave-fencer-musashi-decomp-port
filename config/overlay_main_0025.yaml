# MAIN.CD member 0025 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_025 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2800 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8608 (the registry base). The payload's
# first word is data; code is [0x800CAE14, 0x800CBC84) (0xE70 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0025
sha1: 8aec698f7459e92fbcbfc3f5f998e499b3a4b5f0

options:
  platform: psx
  basename: main_0025
  base_path: ../
  target_path: extracted/overlays/main/0025.bin
  asm_path: asm/overlays/main_0025
  src_path: src/overlays/main_0025
  build_path: build
  ld_script_path: config/main_0025.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0025.auto.txt
    - config/symbol_addrs.main_0025.txt
  undefined_syms_auto_path: config/undefined_syms.main_0025.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0025.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0025
    type: code
    start: 0x0
    vram: 0x800C8608
    subsegments:
      - [0x0, data, main_0025_container]
      - [0x2800, data, main_0025_hdr]
      - [0x280C, asm, main_0025]
      - [0x367C, data, main_0025_tail]

  - [0x12800]
