# MAIN.CD member 0033 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_033 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2800 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8608 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CB858) (0xA4C bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0033
sha1: 5983ba85b7844612d138c625823523776658fb9e

options:
  platform: psx
  basename: main_0033
  base_path: ../
  target_path: extracted/overlays/main/0033.bin
  asm_path: asm/overlays/main_0033
  src_path: src/overlays/main_0033
  build_path: build
  ld_script_path: config/main_0033.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0033.auto.txt
    - config/symbol_addrs.main_0033.txt
  undefined_syms_auto_path: config/undefined_syms.main_0033.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0033.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0033
    type: code
    start: 0x0
    vram: 0x800C8608
    subsegments:
      - [0x0, data, main_0033_container]
      - [0x2800, data, main_0033_hdr]
      - [0x2804, asm, main_0033]
      - [0x3250, data, main_0033_tail]

  - [0x10000]
