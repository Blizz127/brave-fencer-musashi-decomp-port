# MAIN.CD member 0017 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_017 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2800 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8608 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CB318) (0x50C bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0017
sha1: 4dace75f774cb2708aabb30d720fefa328a341ef

options:
  platform: psx
  basename: main_0017
  base_path: ../
  target_path: extracted/overlays/main/0017.bin
  asm_path: asm/overlays/main_0017
  src_path: src/overlays/main_0017
  build_path: build
  ld_script_path: config/main_0017.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0017.auto.txt
    - config/symbol_addrs.main_0017.txt
  undefined_syms_auto_path: config/undefined_syms.main_0017.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0017.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0017
    type: code
    start: 0x0
    vram: 0x800C8608
    subsegments:
      - [0x0, data, main_0017_container]
      - [0x2800, data, main_0017_hdr]
      - [0x2804, asm, main_0017]
      - [0x2D10, data, main_0017_tail]

  - [0x10000]
