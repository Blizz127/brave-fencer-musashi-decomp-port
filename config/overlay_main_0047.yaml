# MAIN.CD member 0047 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_047 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-1 header at 0x0; the payload starts at file offset 0x800 and loads at
# 0x800CCB1C, so file offset 0 maps to 0x800CC31C (the registry base). The payload's
# first word is data; code is [0x800CCB20, 0x800CD6C8) (0xBA8 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0047
sha1: 2f8e6d77287a510e544110a7081461245c9da5e8

options:
  platform: psx
  basename: main_0047
  base_path: ../
  target_path: extracted/overlays/main/0047.bin
  asm_path: asm/overlays/main_0047
  src_path: src/overlays/main_0047
  build_path: build
  ld_script_path: config/main_0047.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0047.auto.txt
    - config/symbol_addrs.main_0047.txt
  undefined_syms_auto_path: config/undefined_syms.main_0047.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0047.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0047
    type: code
    start: 0x0
    vram: 0x800CC31C
    subsegments:
      - [0x0, data, main_0047_container]
      - [0x800, data, main_0047_hdr]
      - [0x804, asm, main_0047]
      - [0x13AC, data, main_0047_tail]

  - [0x7000]
