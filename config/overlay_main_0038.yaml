# MAIN.CD member 0038 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_038 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x3000 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C7E08 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CBB44) (0xD38 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0038
sha1: 09f9a4c4b63bf793d7da16968dd59a509699c7a4

options:
  platform: psx
  basename: main_0038
  base_path: ../
  target_path: extracted/overlays/main/0038.bin
  asm_path: asm/overlays/main_0038
  src_path: src/overlays/main_0038
  build_path: build
  ld_script_path: config/main_0038.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0038.auto.txt
    - config/symbol_addrs.main_0038.txt
  undefined_syms_auto_path: config/undefined_syms.main_0038.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0038.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0038
    type: code
    start: 0x0
    vram: 0x800C7E08
    subsegments:
      - [0x0, data, main_0038_container]
      - [0x3000, data, main_0038_hdr]
      - [0x3004, asm, main_0038]
      - [0x3D3C, data, main_0038_tail]

  - [0x8800]
