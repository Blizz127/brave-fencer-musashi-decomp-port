# MAIN.CD member 0037 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_037 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2800 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8608 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CB5D4) (0x7C8 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0037
sha1: ffc44b3e6e181f97b6dbda1c4b7ff254448e5b46

options:
  platform: psx
  basename: main_0037
  base_path: ../
  target_path: extracted/overlays/main/0037.bin
  asm_path: asm/overlays/main_0037
  src_path: src/overlays/main_0037
  build_path: build
  ld_script_path: config/main_0037.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0037.auto.txt
    - config/symbol_addrs.main_0037.txt
  undefined_syms_auto_path: config/undefined_syms.main_0037.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0037.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0037
    type: code
    start: 0x0
    vram: 0x800C8608
    subsegments:
      - [0x0, data, main_0037_container]
      - [0x2800, data, main_0037_hdr]
      - [0x2804, asm, main_0037]
      - [0x2FCC, data, main_0037_tail]

  - [0xF000]
