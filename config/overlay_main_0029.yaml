# MAIN.CD member 0029 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_029 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2800 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8608 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CB49C) (0x690 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0029
sha1: 867c2eab2e593489332cd8dbc65e2165ae5f2c99

options:
  platform: psx
  basename: main_0029
  base_path: ../
  target_path: extracted/overlays/main/0029.bin
  asm_path: asm/overlays/main_0029
  src_path: src/overlays/main_0029
  build_path: build
  ld_script_path: config/main_0029.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0029.auto.txt
    - config/symbol_addrs.main_0029.txt
  undefined_syms_auto_path: config/undefined_syms.main_0029.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0029.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0029
    type: code
    start: 0x0
    vram: 0x800C8608
    subsegments:
      - [0x0, data, main_0029_container]
      - [0x2800, data, main_0029_hdr]
      - [0x2804, asm, main_0029]
      - [0x2E94, data, main_0029_tail]

  - [0xD800]
