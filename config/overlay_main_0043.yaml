# MAIN.CD member 0043 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_043 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-1 header at 0x0; the payload starts at file offset 0x800 and loads at
# 0x800CCB1C, so file offset 0 maps to 0x800CC31C (the registry base). The payload's
# first word is data; code is [0x800CCB20, 0x800CD6DC) (0xBBC bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0043
sha1: 36a9fa85e0988639cce1986c65b588ac1a007f82

options:
  platform: psx
  basename: main_0043
  base_path: ../
  target_path: extracted/overlays/main/0043.bin
  asm_path: asm/overlays/main_0043
  src_path: src/overlays/main_0043
  build_path: build
  ld_script_path: config/main_0043.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0043.auto.txt
    - config/symbol_addrs.main_0043.txt
  undefined_syms_auto_path: config/undefined_syms.main_0043.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0043.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0043
    type: code
    start: 0x0
    vram: 0x800CC31C
    subsegments:
      - [0x0, data, main_0043_container]
      - [0x800, data, main_0043_hdr]
      - [0x804, asm, main_0043]
      - [0x13C0, data, main_0043_tail]

  - [0x7000]
