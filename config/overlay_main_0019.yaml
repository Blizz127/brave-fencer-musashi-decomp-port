# MAIN.CD member 0019 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_019 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x2000 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C8E08 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CBFAC) (0x11A0 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0019
sha1: e418de1ba4199ad29303a9789c6e54ccaae3a526

options:
  platform: psx
  basename: main_0019
  base_path: ../
  target_path: extracted/overlays/main/0019.bin
  asm_path: asm/overlays/main_0019
  src_path: src/overlays/main_0019
  build_path: build
  ld_script_path: config/main_0019.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0019.auto.txt
    - config/symbol_addrs.main_0019.txt
  undefined_syms_auto_path: config/undefined_syms.main_0019.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0019.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0019
    type: code
    start: 0x0
    vram: 0x800C8E08
    subsegments:
      - [0x0, data, main_0019_container]
      - [0x2000, data, main_0019_hdr]
      - [0x2004, asm, main_0019]
      - [0x31A4, data, main_0019_tail]

  - [0x11800]
