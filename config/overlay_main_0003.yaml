# MAIN.CD member 0003 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_003 (Druthulu/BFM-decomp;
# vendor FILE_/md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
