    type: code
    start: 0x0
    vram: 0x8007CDF8
    subsegments:
      # PAC container header(s) and any data chunk before the payload.
      - [0x0, data, main_0003_container]
      # Payload header word(s) before the first function.
      - [0x52000, data, main_0003_hdr]
      # Code: vram 0x800CEED0..0x800D3200.
      - [0x520D8, asm, main_0003]
      # One data word between the C code and the two handwritten MDEC routines.
      - [0x56408, data, main_0003_word]
      # Handwritten asm (vendor verbatim manifest: PERMANENT-VERBATIM):
      # func_800D3204 (12 ins) and func_800D3234 (208 ins), ending 0x800D3574.
      - [0x5640C, asm, main_0003_mdec]
      # Data after the code, through the end of the member.
      - [0x5677C, data, main_0003_tail]

  # End marker: the member is 0x7D000 bytes.
  - [0x7D000]
