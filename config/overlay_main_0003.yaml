# CONTAINER: PAC header at 0x0, second header at 0x51800; the payload starts at file offset 0x52000.
# The payload loads at 0x800CEDF8, so file offset 0 maps to 0x8007CDF8 (the registry base).
# C code is 0x800CEED0..0x800D3200, then one data word and two handwritten
# routines to 0x800D3574. For the C part: every vendor function start lands on a function start in
# these bytes, and the end is the last function's final `jr $ra` (no branch reaches past it).
# Function starts: config/symbol_addrs.main_0003.auto.txt (see its header).
name: MAIN.CD member 0003
sha1: fe6e14d96ff11cd1babf33476d70f615a99d7bf0

options:
  platform: psx
  basename: main_0003
  # Paths resolve relative to this file's directory.
  base_path: ../
  target_path: extracted/overlays/main/0003.bin
  asm_path: asm/overlays/main_0003
  src_path: src/overlays/main_0003
  build_path: build
  ld_script_path: config/main_0003.ld
