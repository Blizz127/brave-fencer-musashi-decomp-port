# MAIN.CD member 0040 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_040 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x3000 and loads at
# 0x800CAE08, so file offset 0 maps to 0x800C7E08 (the registry base). The payload's
# first word is data; code is [0x800CAE0C, 0x800CB8C8) (0xABC bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0040
sha1: 494e29ac9a8b992a43da8c2fa7d98ec7185589fc

options:
  platform: psx
  basename: main_0040
  base_path: ../
  target_path: extracted/overlays/main/0040.bin
  asm_path: asm/overlays/main_0040
  src_path: src/overlays/main_0040
  build_path: build
  ld_script_path: config/main_0040.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0040.auto.txt
    - config/symbol_addrs.main_0040.txt
  undefined_syms_auto_path: config/undefined_syms.main_0040.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0040.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0040
    type: code
    start: 0x0
    vram: 0x800C7E08
    subsegments:
      - [0x0, data, main_0040_container]
      - [0x3000, data, main_0040_hdr]
      - [0x3004, asm, main_0040]
      - [0x3AC0, data, main_0040_tail]

  - [0x8800]
