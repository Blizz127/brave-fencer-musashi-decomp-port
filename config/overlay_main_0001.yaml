# MAIN.CD member 0001 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_001 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-0 header at 0x0; the payload starts at file offset 0x15000 and loads at
# 0x800CEDF8, so file offset 0 maps to 0x800B9DF8 (the registry base). The payload's
# first word is data; code is [0x800CEDFC, 0x800CF3E8) (0x5EC bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0001
sha1: ac2f0313b8f3483b7451e2b03728439680709fce

options:
  platform: psx
  basename: main_0001
  base_path: ../
  target_path: extracted/overlays/main/0001.bin
  asm_path: asm/overlays/main_0001
  src_path: src/overlays/main_0001
  build_path: build
  ld_script_path: config/main_0001.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0001.auto.txt
    - config/symbol_addrs.main_0001.txt
  undefined_syms_auto_path: config/undefined_syms.main_0001.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0001.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0001
    type: code
    start: 0x0
    vram: 0x800B9DF8
    subsegments:
      - [0x0, data, main_0001_container]
      - [0x15000, data, main_0001_hdr]
      - [0x15004, asm, main_0001]
      - [0x155F0, data, main_0001_tail]

  - [0x1A000]
