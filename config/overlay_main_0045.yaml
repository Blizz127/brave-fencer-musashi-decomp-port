# MAIN.CD member 0045 — vendor counterpart vendor/bfm-decomp/src/md_MAIN_045 (Druthulu/BFM-decomp;
# vendor md_MAIN_ numbering is 0-based, the same as extracted/overlays/main/NNNN.bin).
#
# CONTAINER: PAC type-1 header at 0x0; the payload starts at file offset 0x800 and loads at
# 0x800CCB1C, so file offset 0 maps to 0x800CC31C (the registry base). The payload's
# first word is data; code is [0x800CCB20, 0x800CD668) (0xB48 bytes), taken from the
# vendor's function starts and the last jr $ra before the first data symbol it references.
name: MAIN.CD member 0045
sha1: 6d9d6d1910faeccb7985f086c33d9d67438564a7

options:
  platform: psx
  basename: main_0045
  base_path: ../
  target_path: extracted/overlays/main/0045.bin
  asm_path: asm/overlays/main_0045
  src_path: src/overlays/main_0045
  build_path: build
  ld_script_path: config/main_0045.ld
  symbol_addrs_path:
    - config/symbol_addrs.main_0045.auto.txt
    - config/symbol_addrs.main_0045.txt
  undefined_syms_auto_path: config/undefined_syms.main_0045.auto.txt
  undefined_funcs_auto_path: config/undefined_funcs.main_0045.auto.txt
  create_undefined_syms_auto: True
  create_undefined_funcs_auto: True
  create_asm_dependencies: True
  find_file_boundaries: True
  use_legacy_include_asm: False
  asm_inc_header: ""
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - name: main_0045
    type: code
    start: 0x0
    vram: 0x800CC31C
    subsegments:
      - [0x0, data, main_0045_container]
      - [0x800, data, main_0045_hdr]
      - [0x804, asm, main_0045]
      - [0x134C, data, main_0045_tail]

  - [0x8000]
