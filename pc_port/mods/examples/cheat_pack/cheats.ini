; Poke cheats write `value` to `address` every frame. Copy cheats copy
; `width` bytes from `copy_from` to `address` every frame, e.g. current =
; max. Widths are bytes (1, 2 or 4). Addresses are the SLUS-00726 (US) live
; state; see bfm_plat_events.h BFM_GUEST_*.

[cheat infinite_hp]
description = HP stays at its maximum (gauge 1 current = max)
address = 0x80078EB4
copy_from = 0x80078EB2
width = 2
enabled = 0

[cheat infinite_bp]
description = BP stays at its maximum (gauge 2 current = max)
address = 0x80078EB8
copy_from = 0x80078EB6
width = 2
enabled = 0

[cheat max_money]
description = Money held at 99999 (the game's own cap)
address = 0x80078E8C
value = 99999
width = 4
enabled = 0

[cheat max_hp_gauge]
description = Gauge 1 maximum at 500 (the game's cap in func_8014BC0C)
address = 0x80078EB2
value = 500
width = 2
enabled = 0
